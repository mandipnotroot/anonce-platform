# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: make fmt-check
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.1"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:interop
